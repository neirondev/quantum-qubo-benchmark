problem:
  id: UI-005
  title: QUBO-отбор согласованного подмножества гипотез из графа знаний
  description: >
    Метанаучный цикл порождает граф: узлы — гипотезы/механизмы, рёбра — связи
    (поддержка/противоречие/совместный перенос) с весами (новизна, доказательность,
    стоимость проверки, каузальная согласованность). Нужно выбрать подмножество
    гипотез максимальной суммарной ценности при штрафах за противоречия и бюджете
    на проверку — комбинаторная задача, растущая с харвестером до тысяч узлов.
  system: взвешенный граф гипотез + бинарный вектор включения x
  desired_state: формализатор graph→QUBO + решатели (классический annealer сейчас, D-Wave/QAOA потом) + бенчмарк
  constraints:
    - simulator-first: реальный QPU только после доказанной пользы на симуляторе
    - классический baseline обязателен в каждом прогоне
    - cost-guard на любые платные бэкенды
  measurable_variables: [objective value, feasibility, runtime, cost_usd, gap к baseline]
  validation: Max-Cut санити-тест + синтетический граф гипотез 100..2000 узлов
  reference: ../quantum_cloud_for_development.md (§9, §10, §13-16, §19)
