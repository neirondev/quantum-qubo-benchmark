id: Q2
title: Ансамбли разнообразия — сэмплер против мультистарта по РАЗНООБРАЗИЮ хороших решений
source: >
  Находка консилиума (quantum-integration-advice.md) + next_experiment из Q1/Q3:
  в комбинаторных задачах ценен не один оптимум, а АНСАМБЛЬ структурно-разных
  хороших решений (для сметчика — рекомендация №2: 2-3 набора поставщиков).
  Q1 показал: по КАЧЕСТВУ одного решения квант проигрывает. Здесь метрика другая.
question: >
  Даёт ли сэмплер (QAOA-распределение с Aer / стохастика neal) больше СТРУКТУРНО
  РАЗНЫХ хороших решений, чем честный мультистарт классики, при равном бюджете?
abstraction: >
  «Хорошее» = решение в пределах ε (напр. 5%) от оптимума. «Разнообразие» =
  число кластеров по Хэммингу (порог d) среди хороших, или средне-попарный
  Хэмминг. Сравнение при РАВНОМ числе оценок целевой функции.
success_criteria:
  - на инстансах Q1 (qubo-*.json, оптимум brute известен): для каждого метода
    (neal-мультистарт K рестартов, QAOA-сэмплы 8192 шота, случайный+жадный рестарт)
    — число ε-хороших кластеров и средне-попарный Хэмминг, при равном #оценок
  - таблица n×метод, среднее±σ по 3 сидам
  - вердикт: где сэмплер реально даёт больше разнообразия (или нет)
infrastructure:
  interpreter: /Library/Frameworks/Python.framework/Versions/3.13/bin/python3
  reuse: qubo.mjs (--evaluate), neal_solve.py, qaoa_experiment.py (схема+углы),
         gate_neal_repair.py (репайр обязателен!), qubo-*.json (инстансы с известным brute)
budget: $0 локально; QPU-сэмплы — отдельная фаза по одобрению (только если локально виден сигнал)
honesty:
  - равный бюджет оценок — иначе сравнение нечестно (у сэмплера 8192 «бесплатных» шота ≠ честно)
  - все решения feasible (репайр) перед подсчётом разнообразия
  - разнообразие среди МУСОРА не считается — только ε-хорошие
status: workspace готов (вся инфраструктура Q1 скопирована)
